<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt OCR</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2430; --muted: #66707f; --line: #dde2e8; --accent: #1f6feb; --warn: #b54708; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11151b; --card: #1a2029; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b3440; --accent: #4c8dff; --warn: #f5a35c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; background: var(--card); cursor: pointer; }
    #drop.over { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
    img { max-width: 100%; border-radius: 6px; }
    pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); max-height: 260px; overflow: auto; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    td { padding: 4px 0; border-top: 1px solid var(--line); }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .notes { color: var(--warn); font-size: 13px; }
    progress { width: 100%; }
  </style>
</head>
<body>
<main>
  <h1>Receipt OCR</h1>
  <p class="lead">Drop a photo of a till slip. Text recognition runs in your browser with Tesseract.js, so the image isn't uploaded anywhere.</p>

  <label id="drop">
    <input id="file" type="file" accept="image/*" hidden>
    Drop an image here or click to choose one
  </label>
  <progress id="progress" value="0" max="1" hidden></progress>

  <div class="grid" id="out" hidden>
    <div class="card"><img id="preview" alt="Receipt"><pre id="raw"></pre></div>
    <div class="card">
      <dl id="fields"></dl>
      <table id="items"></table>
      <p class="notes" id="notes"></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module">
  import { parseReceipt } from '../src/parse.js';

  const $ = id => document.getElementById(id);
  const money = v => v == null ? '-' : 'R ' + v.toFixed(2);

  async function run(file) {
    $('out').hidden = false;
    $('preview').src = URL.createObjectURL(file);
    $('progress').hidden = false;
    $('raw').textContent = '';
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => { if (m.status === 'recognizing text') $('progress').value = m.progress; },
    });
    await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
    const { data } = await worker.recognize(file);
    await worker.terminate();
    $('progress').hidden = true;

    const r = parseReceipt(data.text);
    $('raw').textContent = data.text;
    $('fields').innerHTML = '';
    for (const [label, value] of [
      ['Merchant', r.merchant ?? '-'], ['Date', r.date ?? '-'], ['Total', money(r.total)],
      ['VAT', money(r.vat)], ['Confidence', Math.round(r.confidence * 100) + '%'],
    ]) {
      const dt = document.createElement('dt'); dt.textContent = label;
      const dd = document.createElement('dd'); dd.textContent = value;
      $('fields').append(dt, dd);
    }
    $('items').innerHTML = '';
    for (const item of r.items) {
      const tr = $('items').insertRow();
      tr.insertCell().textContent = (item.qty > 1 ? item.qty + ' x ' : '') + item.description;
      tr.insertCell().textContent = money(item.amount);
    }
    $('notes').textContent = r.notes.join('. ');
  }

  $('file').addEventListener('change', e => e.target.files[0] && run(e.target.files[0]));
  const drop = $('drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]);
  });
</script>
</body>
</html>
